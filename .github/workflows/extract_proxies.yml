name: Extract Telegram Proxies and Publish

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Least privilege: the job only needs to push generated files.
permissions:
  contents: write

# Never let two scans race and force-push over each other.
concurrency:
  group: proxy-scan
  cancel-in-progress: false

jobs:
  extract_proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # The commit step below pushes with the checkout token, so credentials
        # must stay persisted (required by git-auto-commit-action).

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl
          coverage: none

      - name: Validate PHP syntax
        run: php -l extract_proxies.php

      - name: Run scanner
        run: php extract_proxies.php

      - name: Sanity-check generated output
        run: |
          test -s index.html || { echo "index.html is empty"; exit 1; }
          test -s extracted_proxies.json || { echo "extracted_proxies.json is empty"; exit 1; }
          php -r '$d=json_decode(file_get_contents("extracted_proxies.json"),true); if(!is_array($d)){fwrite(STDERR,"invalid JSON\n");exit(1);} echo count($d)." proxies, ".count(array_filter($d,fn($p)=>$p["status"]==="Online"))." online\n";'

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'index.html extracted_proxies.json'
          commit_message: 'chore: update proxy list [skip ci]'
          branch: gh-pages
          create_branch: true
          push_options: '--force-with-lease'
